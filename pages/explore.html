<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore — AKALTYE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script src="https://kit.fontawesome.com/7c89d7deb7.js" crossorigin="anonymous"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Roboto+Mono:wght@300&family=Vollkorn:ital,wght@0,400..900;1,400..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>

    <header>
        <nav>
            <input type="checkbox" class="menu-toggle" id="menuToggle">
            <label for="menuToggle" class="menu-icon">
                <span></span>
            </label>

            <div class="auth-btn" id="authButton"></div>

            <a href="/" class="logo">akal<span>tye</span></a>

            <div class="menu-drawer">
                <ul>
                    <li><a href="/">Home</a></li>
                    <li><a href="explore.html">Explore</a></li>
                    <li><a href="learn.html">Learn</a></li>
                    <li><a href="profile.html">Profile</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <div class="page">
        <div class="container">

            <h1 style="margin-bottom: var(--space-6);">Explore</h1>

            <!--explore search bar-->


            <div class="explore-search">
                <div class="search-wrapper has-icon">
                    <input type="text" class="search-input" id="exploreSearch"
                        placeholder="Search words, categories, examples..." autocomplete="off">
                    <i class="search-icon">🔍</i>
                    <button class="search-clear" id="searchClear" aria-label="Clear search">
                        ✕
                    </button>
                </div>
                <div class="search-results-count" id="searchCount" style="display: none;">
                    Found <strong id="resultCount">0</strong> results
                </div>
            </div>

            <!-- Search results container (hidden by default) -->
            <div class="list" id="searchResults" style="display: none;"></div>

            <!-- Your existing "Your Collections" section goes here -->


            <!-- User's collections -->
            <h2
                style="font-family: var(--font-display); font-size: var(--text-base); font-weight: 400; color: var(--clr-surface-a40); letter-spacing: 0.03em; margin-bottom: var(--space-4);">
                Your Collections
            </h2>

            <div class="tiles">
                <a href="saved.html" class="tile">
                    <div class="tile__content">
                        <i class="fa-solid fa-heart"></i>
                        <span class="tile__label">Favourites</span>
                        <span class="tile__count" id="favCount">0</span>
                    </div>
                </a>

                <a href="history.html" class="tile">
                    <div class="tile__content">
                        <i class="fa-solid fa-clock-rotate-left"></i>
                        <span class="tile__label">History</span>
                        <span class="tile__count" id="historyCount">0</span>
                    </div>
                </a>
            </div>

            <!-- Browse by category -->
            <h2
                style="font-family: var(--font-display); font-size: var(--text-base); font-weight: 400; color: var(--clr-surface-a40); letter-spacing: 0.03em; margin: var(--space-8) 0 var(--space-4);">
                Browse by Category
            </h2>

            <div class="tiles">
                <a href="words.html?tag=animals" class="tile">
                    <div class="tile__content">
                        <i class="fa-solid fa-crow"></i>
                        <span class="tile__label">Animals</span>
                        <span class="tile__count">42</span>
                    </div>
                </a>

                <a href="words.html?tag=family" class="tile">
                    <div class="tile__content">
                        <i class="fa-solid fa-people-group"></i>
                        <span class="tile__label">Family</span>
                        <span class="tile__count">28</span>
                    </div>
                </a>

                <a href="words.html?tag=country" class="tile">
                    <div class="tile__content">
                        <i class="fa-solid fa-mountain-sun"></i>
                        <span class="tile__label">Country</span>
                        <span class="tile__count">56</span>
                    </div>
                </a>

                <a href="words.html?tag=food" class="tile">
                    <div class="tile__content">
                        <i class="fa-solid fa-apple-whole"></i>
                        <span class="tile__label">Food</span>
                        <span class="tile__count">34</span>
                    </div>
                </a>

                <a href="words.html?tag=weather" class="tile">
                    <div class="tile__content">
                        <i class="fa-solid fa-cloud-moon-rain"></i>
                        <span class="tile__label">Weather</span>
                        <span class="tile__count">18</span>
                    </div>
                </a>

                <a href="words.html?tag=time" class="tile">
                    <div class="tile__content">
                        <i class="fa-solid fa-clock"></i>
                        <span class="tile__label">Time</span>
                        <span class="tile__count">22</span>
                    </div>
                </a>

                <a href="words.html?tag=actions" class="tile">
                    <div class="tile__content">
                        <i class="fa-solid fa-person-running"></i>
                        <span class="tile__label">Actions</span>
                        <span class="tile__count">45</span>
                    </div>
                </a>

                <a href="words.html?tag=places" class="tile">
                    <div class="tile__content">
                        <i class="fa-solid fa-location-dot"></i>
                        <span class="tile__label">Places</span>
                        <span class="tile__count">31</span>
                    </div>
                </a>
            </div>

        </div>
    </div>

    <footer class="site-footer">
        <p>
            © 2026 · Made with ❤️ by
            <a href="https://github.com/SamMadeThis">SamMadeThis</a>
            ·
            <a href="https://github.com/SamMadeThis/Akaltye">GitHub</a>
            ·
            <a href="mailto:SamMadeThisGit@outlook.com">Contact</a>
        </p>
    </footer>

    <script type="module" src="/js/nav.js"></script>
    <script type="module" src="/js/explore.js"></script>

</body>

</html>
