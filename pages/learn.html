<!DOCTYPE html>
<!--
  learn.html — Unified Learn page for AKALTYE
  Replaces explore.html and practice.html.
  Shows units in card-focus layout (option B).
  Two screens: #screenUnits (list) and #screenUnit (detail).
  Search bar at top searches full lexicon.
  Practice is auto-filtered to current unit words — no options.
  UPDATED: Added scorecard review functionality
-->
<html lang="en">

<head>
    <script defer src="https://www.googletagmanager.com/gtag/js?id=G-17ZB632V40"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-17ZB632V40');
    </script>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Learn Arrernte — structured units with words, review and tests.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Roboto+Mono:wght@300&family=Vollkorn:ital,wght@0,400..900;1,400..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <title>AKALTYE — Learn</title>
    <style>
        /* NOTE: All learn page styles are inline here for now.
           Consider moving to styles.css for consistency. */

        /* ── Page layout ── */
        .learn-page {
            width: 100%;
            max-width: 560px;
            margin: 0 auto;
            padding: var(--space-7) var(--space-4) var(--space-8);
            display: flex;
            flex-direction: column;
            gap: var(--space-5);
        }

        /* ── Screen transitions ── */
        .learn-screen {
            display: none;
        }

        .learn-screen.active {
            display: flex;
            flex-direction: column;
            gap: var(--space-5);
        }

        /* ── Search bar ── */
        .learn-search-wrap {
            position: relative;
        }

        .learn-search {
            width: 100%;
            background: var(--clr-surface-tonal-a0);
            border: 0.5px solid var(--clr-surface-a10);
            border-radius: var(--radius-md);
            color: var(--clr-light);
            font-family: var(--font-mono);
            font-size: var(--text-xs);
            padding: var(--space-3) var(--space-4) var(--space-3) var(--space-8);
            outline: none;
            transition: border-color var(--transition-fast);
            letter-spacing: 0.03em;
        }

        .learn-search::placeholder {
            color: var(--clr-surface-a30);
        }

        .learn-search:focus {
            border-color: var(--clr-ochre);
        }

        .learn-search-icon {
            position: absolute;
            left: var(--space-3);
            top: 50%;
            transform: translateY(-50%);
            color: var(--clr-surface-a30);
            font-size: 12px;
            pointer-events: none;
        }

        .learn-search-clear {
            position: absolute;
            right: var(--space-3);
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--clr-surface-a30);
            cursor: pointer;
            font-size: 12px;
            display: none;
            padding: 2px;
        }

        .learn-search-clear.visible {
            display: block;
        }

        /* ── Search results dropdown ── */
        .learn-search-results {
            display: none;
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            right: 0;
            background: var(--clr-surface-tonal-a0);
            border: 0.5px solid var(--clr-surface-a10);
            border-radius: var(--radius-md);
            overflow: hidden;
            z-index: 100;
            max-height: 320px;
            overflow-y: auto;
        }

        .learn-search-results.open {
            display: block;
        }

        .search-result-item {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: var(--space-4);
            padding: var(--space-3) var(--space-4);
            border-bottom: 0.5px solid var(--clr-surface-a10);
            cursor: pointer;
            transition: background var(--transition-fast);
            text-decoration: none;
        }

        .search-result-item:last-child {
            border-bottom: none;
        }

        .search-result-item:hover {
            background: rgba(184, 115, 51, 0.06);
        }

        .search-result-word {
            font-family: var(--font-display);
            font-size: var(--text-base);
            color: var(--clr-light);
            margin-bottom: 2px;
        }

        .search-result-def {
            font-family: var(--font-mono);
            font-size: var(--text-xs);
            color: var(--clr-surface-a40);
        }

        .search-result-tag {
            font-family: var(--font-mono);
            font-size: var(--text-xs);
            color: var(--clr-surface-a30);
            white-space: nowrap;
            flex-shrink: 0;
            font-size: 9px;
        }

        .search-result-tag.in-unit {
            color: var(--clr-success-a0);
        }

        .search-no-results {
            padding: var(--space-4);
            font-family: var(--font-mono);
            font-size: var(--text-xs);
            color: var(--clr-surface-a30);
            text-align: center;
        }

        /* ── Stat chips ── */
        .stat-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: var(--space-2);
        }

        .stat-chip {
            background: var(--clr-surface-tonal-a0);
            border: 0.5px solid var(--clr-surface-a10);
            border-radius: var(--radius-sm);
            padding: var(--space-3) var(--space-3);
        }

        .stat-chip-num {
            font-family: var(--font-display);
            font-size: var(--text-lg);
            font-weight: 600;
            color: var(--clr-light);
            line-height: 1;
            margin-bottom: 3px;
        }

        .stat-chip-lbl {
            font-family: var(--font-mono);
            font-size: var(--text-xs);
            color: var(--clr-surface-a40);
            letter-spacing: 0.04em;
        }

        /* ── Active unit card ── */
        .active-unit-card {
            border: 1px solid var(--clr-ochre);
            border-radius: var(--radius-md);
            padding: var(--space-5);
            background: rgba(184, 115, 51, 0.04);
            display: flex;
            flex-direction: column;
            gap: var(--space-3);
        }

        .active-unit-label {
            font-family: var(--font-mono);
            font-size: var(--text-xs);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--clr-ochre);
        }

        .active-unit-name {
            font-family: var(--font-display);
            font-size: var(--text-md);
            font-weight: 500;
            color: var(--clr-light);
        }

        .active-unit-meta {
            font-family: var(--font-mono);
            font-size: var(--text-xs);
            color: var(--clr-surface-a40);
        }

        .unit-prog-track {
            height: 3px;
            background: var(--clr-surface-a10);
            border-radius: 99px;
            overflow: hidden;
        }

        .unit-prog-fill {
            height: 100%;
            background: var(--clr-ochre);
            border-radius: 99px;
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .unit-cta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--clr-ochre);
            border-radius: var(--radius-sm);
            padding: var(--space-4) var(--space-4);
            cursor: pointer;
            border: none;
            width: 100%;
            text-align: left;
            transition: background var(--transition-fast);
        }

        .unit-cta:hover {
            background: #c97d38;
        }

        .unit-cta:active {
            transform: scale(0.99);
        }

        .unit-cta-text {
            font-family: var(--font-display);
            font-size: var(--text-base);
            font-weight: 500;
            color: #1a0a00;
        }

        .unit-cta-sub {
            font-family: var(--font-mono);
            font-size: var(--text-xs);
            color: rgba(26, 10, 0, 0.55);
            margin-top: 2px;
        }

        .unit-cta-arr {
            font-size: var(--text-base);
            color: #1a0a00;
        }

        /* ── Locked units list ── */
        .section-lbl {
            font-family: var(--font-mono);
            font-size: var(--text-xs);
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--clr-surface-a30);
        }

        .locked-unit-row {
            display: flex;
            align-items: center;
            gap: var(--space-3);
            padding: var(--space-3) var(--space-4);
            border: 0.5px solid var(--clr-surface-a10);
            border-radius: var(--radius-sm);
            opacity: 0.45;
        }

        .locked-unit-num {
            font-family: var(--font-mono);
            font-size: var(--text-xs);
            color: var(--clr-surface-a30);
            width: 20px;
            flex-shrink: 0;
        }

        .locked-unit-name {
            font-family: var(--font-display);
            font-size: var(--text-base);
            color: var(--clr-surface-a50);
            flex: 1;
        }

        .locked-unit-meta {
            font-family: var(--font-mono);
            font-size: var(--text-xs);
            color: var(--clr-surface-a30);
        }

        /* Complete unit row */
        .complete-unit-row {
            display: flex;
            align-items: center;
            gap: var(--space-3);
            padding: var(--space-3) var(--space-4);
            border: 0.5px solid var(--clr-success-a0);
            border-radius: var(--radius-sm);
            background: rgba(34, 148, 110, 0.05);
            cursor: pointer;
            transition: background var(--transition-fast);
        }

        .complete-unit-row:hover {
            background: rgba(34, 148, 110, 0.1);
        }

        /* ── Unit detail screen ── */
        .back-btn {
            font-family: var(--font-mono);
            font-size: var(--text-xs);
            color: var(--clr-surface-a40);
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            transition: color var(--transition-fast);
            align-self: flex-start;
        }

        .back-btn:hover {
            color: var(--clr-ochre);
        }

        .unit-detail-hero {
            background: var(--clr-surface-tonal-a0);
            border: 0.5px solid var(--clr-surface-a10);
            border-radius: var(--radius-md);
            padding: var(--space-5);
            display: flex;
            flex-direction: column;
            gap: var(--space-3);
        }

        .unit-detail-status {
            display: inline-flex;
            font-family: var(--font-mono);
            font-size: var(--text-xs);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            border-radius: var(--radius-pill);
            padding: 3px 10px;
            align-self: flex-start;
        }

        .unit-detail-status.active {
            border: 0.5px solid var(--clr-ochre);
            color: var(--clr-ochre);
        }

        .unit-detail-status.locked {
            border: 0.5px solid var(--clr-surface-a20);
            color: var(--clr-surface-a30);
        }

        .unit-detail-status.complete {
            border: 0.5px solid var(--clr-success-a0);
            color: var(--clr-success-a10);
        }

        .unit-detail-title {
            font-family: var(--font-display);
            font-size: var(--text-lg);
            font-weight: 500;
            color: var(--clr-light);
        }

        .unit-detail-meta {
            font-family: var(--font-mono);
            font-size: var(--text-xs);
            color: var(--clr-surface-a40);
        }

        /* word chips */
        .word-chips-wrap {
            display: flex;
            flex-wrap: wrap;
            gap: var(--space-2);
            margin-top: var(--space-1);
        }

        .word-chip {
            font-family: var(--font-mono);
            font-size: var(--text-xs);
            border-radius: var(--radius-pill);
            padding: 3px 10px;
            border: 0.5px solid var(--clr-surface-a20);
            color: var(--clr-surface-a50);
        }

        .word-chip.seen {
            border-color: var(--clr-success-a0);
            color: var(--clr-success-a10);
            background: rgba(34, 148, 110, 0.07);
        }

        /* steps */
        .steps-list {
            display: flex;
            flex-direction: column;
        }

        .step-row {
            display: flex;
            align-items: center;
            gap: var(--space-3);
            padding: var(--space-3) 0;
            border-bottom: 0.5px solid var(--clr-surface-a10);
        }

        .step-row:last-child {
            border-bottom: none;
        }

        .step-num {
            width: 26px;
            height: 26px;
            border-radius: 99px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-mono);
            font-size: var(--text-xs);
            flex-shrink: 0;
        }

        .step-num.done {
            background: rgba(34, 148, 110, 0.15);
            color: var(--clr-success-a10);
        }

        .step-num.now {
            background: rgba(184, 115, 51, 0.15);
            color: var(--clr-ochre);
            border: 0.5px solid var(--clr-ochre);
        }

        .step-num.todo {
            background: var(--clr-surface-tonal-a0);
            color: var(--clr-surface-a30);
            border: 0.5px solid var(--clr-surface-a10);
        }

        .step-name {
            font-family: var(--font-display);
            font-size: var(--text-base);
            color: var(--clr-light);
            flex: 1;
        }

        .step-name.done {
            color: var(--clr-surface-a40);
        }

        .step-state {
            font-family: var(--font-mono);
            font-size: var(--text-xs);
            color: var(--clr-surface-a30);
        }

        .step-state.done {
            color: var(--clr-success-a0);
        }

        .step-state.now {
            color: var(--clr-ochre);
        }

        /* practice mode list */
        .mode-item {
            display: flex;
            align-items: center;
            gap: var(--space-4);
            padding: var(--space-3) 0;
            border-bottom: 0.5px solid var(--clr-surface-a10);
            cursor: pointer;
            text-decoration: none;
            transition: opacity var(--transition-fast);
        }

        .mode-item:last-child {
            border-bottom: none;
        }

        .mode-item:hover .mode-item-name {
            color: var(--clr-ochre);
        }

        .mode-item-icon {
            width: 34px;
            height: 34px;
            border-radius: var(--radius-sm);
            border: 0.5px solid var(--clr-surface-a20);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
            transition: border-color var(--transition-fast);
        }

        .mode-item:hover .mode-item-icon {
            border-color: var(--clr-ochre);
        }

        .mode-item-name {
            font-family: var(--font-display);
            font-size: var(--text-base);
            font-weight: 500;
            color: var(--clr-light);
            transition: color var(--transition-fast);
        }

        .mode-item-desc {
            font-family: var(--font-mono);
            font-size: var(--text-xs);
            color: var(--clr-surface-a40);
        }

        .mode-item-arr {
            font-family: var(--font-mono);
            font-size: var(--text-xs);
            color: var(--clr-surface-a30);
            margin-left: auto;
        }

        .step-row[style*="cursor:pointer"]:hover {
            background: rgba(184, 115, 51, 0.06);
            border-radius: var(--radius-sm);
        }

        .step-row[style*="cursor:pointer"]:hover .step-state {
            color: var(--clr-ochre) !important;
        }
    </style>
</head>

<body>
    <header></header>

    <div class="page-content" style="align-items:flex-start;justify-content:flex-start;padding:0;">
        <div class="learn-page">

            <!-- ═══════════════════════════════════════
           SCREEN 1 — UNITS LIST
           ═══════════════════════════════════════ -->
            <div class="learn-screen active" id="screenUnits">

                <!-- Search bar -->
                <div class="learn-search-wrap">
                    <i class="fa-solid fa-magnifying-glass learn-search-icon"></i>
                    <input class="learn-search" id="learnSearch" placeholder="Search all 325 words…" autocomplete="off"
                        autocorrect="off">
                    <button class="learn-search-clear" id="learnSearchClear">✕</button>
                    <div class="learn-search-results" id="learnSearchResults"></div>
                </div>

                <!-- Stats row -->
                <div class="stat-row" id="learnStats">
                    <div class="stat-chip">
                        <div class="stat-chip-num" id="statSeen">—</div>
                        <div class="stat-chip-lbl">Words seen</div>
                    </div>
                    <div class="stat-chip">
                        <div class="stat-chip-num" id="statStreak">—</div>
                        <div class="stat-chip-lbl">Day streak</div>
                    </div>
                    <div class="stat-chip">
                        <div class="stat-chip-num" id="statUnits">—</div>
                        <div class="stat-chip-lbl">Units done</div>
                    </div>
                </div>

                <!-- Active unit card -->
                <div id="activeUnitWrap"></div>

                <!-- Completed units -->
                <div id="completedUnitsWrap" style="display:none;">
                    <div class="section-lbl" style="margin-bottom:var(--space-3);">Completed</div>
                    <div id="completedUnitsList" style="display:flex;flex-direction:column;gap:var(--space-2);"></div>
                </div>

                <!-- Upcoming locked units -->
                <div id="lockedUnitsWrap">
                    <div class="section-lbl" style="margin-bottom:var(--space-3);">Coming next</div>
                    <div id="lockedUnitsList" style="display:flex;flex-direction:column;gap:var(--space-2);"></div>
                </div>

            </div><!-- /screenUnits -->


            <!-- ═══════════════════════════════════════
           SCREEN 2 — UNIT DETAIL
           ═══════════════════════════════════════ -->
            <div class="learn-screen" id="screenUnit">

                <button class="back-btn" id="backToUnits">← Learn</button>

                <!-- Hero card -->
                <div class="unit-detail-hero" id="unitDetailHero"></div>

                <!-- Steps -->
                <div>
                    <div class="section-lbl" style="margin-bottom:var(--space-3);">Your progress</div>
                    <div class="steps-list" id="unitSteps"></div>
                </div>

                <!-- Main CTA -->
                <button class="unit-cta" id="unitMainCta">
                    <div>
                        <div class="unit-cta-text" id="unitCtaText">Continue learning</div>
                        <div class="unit-cta-sub" id="unitCtaSub"></div>
                    </div>
                    <span class="unit-cta-arr">→</span>
                </button>

                <!-- Practice games for this unit -->
                <div id="unitPracticeWrap" style="display:none;">
                    <div class="section-lbl" style="margin-bottom:var(--space-3);">Quick practice</div>
                    <div class="mode-item" id="modeGuess">
                        <div class="mode-item-icon"><i class="fa-solid fa-question"></i></div>
                        <div>
                            <div class="mode-item-name">Guess the word</div>
                            <div class="mode-item-desc">English → Arrernte</div>
                        </div>
                        <span class="mode-item-arr">→</span>
                    </div>
                    <div class="mode-item" id="modeMeaning">
                        <div class="mode-item-icon"><i class="fa-solid fa-book-open"></i></div>
                        <div>
                            <div class="mode-item-name">Meaning match</div>
                            <div class="mode-item-desc">Arrernte → English</div>
                        </div>
                        <span class="mode-item-arr">→</span>
                    </div>
                    <div class="mode-item" id="modeGap">
                        <div class="mode-item-icon"><i class="fa-solid fa-pencil"></i></div>
                        <div>
                            <div class="mode-item-name">Fill the gap</div>
                            <div class="mode-item-desc">Complete the sentence</div>
                        </div>
                        <span class="mode-item-arr">→</span>
                    </div>
                    <div class="mode-item" id="modeShuffle">
                        <div class="mode-item-icon"><i class="fa-solid fa-dice"></i></div>
                        <div>
                            <div class="mode-item-name">Game shuffle</div>
                            <div class="mode-item-desc">Mix of all types</div>
                        </div>
                        <span class="mode-item-arr">→</span>
                    </div>
                </div>

                <!-- Scorecard review section (appears after tests completed) -->
                <div id="unitScorecardWrap" style="display:none;">
                    <div class="section-lbl" style="margin-bottom:var(--space-3);">Review your results</div>
                    <div id="scorecardsList"></div>
                </div>

            </div><!-- /screenUnit -->

        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script type="module">
        import { getWords } from '../js/words-service.js';
        import { db } from '../js/firebase-config.js';
        import { auth } from '../js/firebase-config.js';
        import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js';
        import { collection, getDocs, query, orderBy } from 'https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js';

        /* ── State ── */
        let WORDS = [];
        let UNITS = [];
        let currentUnit = null;

        /* ── Helpers ── */
        const $ = id => document.getElementById(id);
        const firstDef = w => Array.isArray(w.definition) ? w.definition[0] : w.definition;

        function getSeenMap() {
            try { return JSON.parse(localStorage.getItem('lexicon_seen') || '{}'); } catch { return {}; }
        }
        function getStreak() {
            try { return JSON.parse(localStorage.getItem('lexicon_streak') || '{}'); } catch { return {}; }
        }
        function getUnitProgress(unitId) {
            try { return JSON.parse(localStorage.getItem(`akaltye_unit_${unitId}`) || '{}'); } catch { return {}; }
        }

        /* ── Screen switching ── */
        function showScreen(id) {
            document.querySelectorAll('.learn-screen').forEach(s => s.classList.remove('active'));
            $(id).classList.add('active');
            window.scrollTo(0, 0);
        }

        /* ══════════════════════════════════════════
           SEARCH
           ══════════════════════════════════════════ */

        const searchInput = $('learnSearch');
        const searchResults = $('learnSearchResults');
        const searchClear = $('learnSearchClear');

        searchInput.addEventListener('input', () => {
            const q = searchInput.value.trim();
            searchClear.classList.toggle('visible', q.length > 0);
            if (q.length < 2) { searchResults.classList.remove('open'); return; }
            runSearch(q);
        });

        searchClear.addEventListener('click', () => {
            searchInput.value = '';
            searchClear.classList.remove('visible');
            searchResults.classList.remove('open');
            searchInput.focus();
        });

        document.addEventListener('click', e => {
            if (!e.target.closest('.learn-search-wrap')) {
                searchResults.classList.remove('open');
            }
        });

        function runSearch(q) {
            const lower = q.toLowerCase();
            const assignedIds = new Set(UNITS.flatMap(u => u.wordIds || []));

            const matches = WORDS.filter(w => {
                const defs = (Array.isArray(w.definition) ? w.definition : [w.definition]).join(' ').toLowerCase();
                return w.word.toLowerCase().includes(lower) ||
                    defs.includes(lower) ||
                    (w.phonetic || '').toLowerCase().includes(lower);
            }).slice(0, 20);

            if (!matches.length) {
                searchResults.innerHTML = `<div class="search-no-results">No words found for "${q}"</div>`;
                searchResults.classList.add('open');
                return;
            }

            searchResults.innerHTML = matches.map(w => {
                const inUnit = assignedIds.has(w.id);
                const def = firstDef(w) || '';
                const tagLabel = inUnit ? 'in your units' : 'not yet released';
                return `<div class="search-result-item" onclick="showWordDetail('${w.id}')">
          <div>
            <div class="search-result-word">${w.word}${w.phonetic ? ` <span style="font-family:var(--font-mono);font-size:10px;color:var(--clr-ochre);font-weight:300;">/${w.phonetic}/</span>` : ''}</div>
            <div class="search-result-def">${def}</div>
          </div>
          <span class="search-result-tag ${inUnit ? 'in-unit' : ''}">${tagLabel}</span>
        </div>`;
            }).join('');
            searchResults.classList.add('open');
        }

        window.showWordDetail = function (id) {
            searchResults.classList.remove('open');
            const w = WORDS.find(w => w.id === id);
            if (!w) return;
            showToast(`${w.word} — ${firstDef(w)}`);
        };

        /* ══════════════════════════════════════════
           UNITS LIST
           ══════════════════════════════════════════ */

        function renderUnitsList() {
            const seen = getSeenMap();
            const streak = getStreak();

            /* Stats */
            $('statSeen').textContent = Object.keys(seen).length;
            $('statStreak').textContent = streak.current || 0;

            const assignedWords = new Set(UNITS.flatMap(u => u.wordIds || []));

            /* Determine unit states */
            let foundActive = false;
            const completed = [];
            const active = [];
            const locked = [];

            UNITS.forEach(u => {
                const progress = getUnitProgress(u.id);
                if (progress.passed) {
                    completed.push(u);
                } else if (!foundActive && u.released) {
                    foundActive = true;
                    active.push(u);
                } else {
                    locked.push(u);
                }
            });

            $('statUnits').textContent = completed.length;

            /* Active unit card */
            const activeWrap = $('activeUnitWrap');
            if (active.length) {
                const u = active[0];
                const wordIds = u.wordIds || [];
                const seenCount = wordIds.filter(id => {
                    const w = WORDS.find(w => w.id === id);
                    return w && seen[w.word];
                }).length;
                const pct = wordIds.length ? Math.round(seenCount / wordIds.length * 100) : 0;
                const progress = getUnitProgress(u.id);
                const ctaLabel = progress.learnDone ? 'Continue to review test' : 'Start learning';
                const ctaSub = `${seenCount} of ${wordIds.length} words seen · ${u.passmark || 80}% to pass`;

                activeWrap.innerHTML = `
          <div class="section-lbl" style="margin-bottom:var(--space-3);">Continue learning</div>
          <div class="active-unit-card" style="cursor:pointer;" onclick="openUnit('${u.id}')">
            <div class="active-unit-label">Unit ${u.order || ''} — in progress</div>
            <div class="active-unit-name">${u.name}</div>
            <div class="active-unit-meta">${u.level} · ${wordIds.length} words</div>
            <div class="unit-prog-track">
              <div class="unit-prog-fill" style="width:${pct}%"></div>
            </div>
            <div style="font-family:var(--font-mono);font-size:var(--text-xs);color:var(--clr-ochre);">${seenCount} of ${wordIds.length} words seen</div>
            <button class="unit-cta" onclick="event.stopPropagation();openUnit('${u.id}')">
              <div>
                <div class="unit-cta-text">${ctaLabel}</div>
                <div class="unit-cta-sub">${ctaSub}</div>
              </div>
              <span class="unit-cta-arr">→</span>
            </button>
          </div>`;
            } else if (!foundActive && UNITS.length) {
                activeWrap.innerHTML = `
          <div style="font-family:var(--font-mono);font-size:var(--text-xs);color:var(--clr-surface-a30);padding:var(--space-4);border:0.5px dashed var(--clr-surface-a10);border-radius:var(--radius-md);text-align:center;">
            No units released yet — check back soon.
          </div>`;
            }

            /* Completed units */
            const completedWrap = $('completedUnitsWrap');
            const completedList = $('completedUnitsList');
            if (completed.length) {
                completedWrap.style.display = 'block';
                completedList.innerHTML = completed.map(u => `
          <div class="complete-unit-row" onclick="openUnit('${u.id}')">
            <span style="font-family:var(--font-mono);font-size:11px;color:var(--clr-success-a0);">✓</span>
            <span style="font-family:var(--font-display);font-size:var(--text-base);color:var(--clr-surface-a50);flex:1;">${u.name}</span>
            <span style="font-family:var(--font-mono);font-size:var(--text-xs);color:var(--clr-success-a0);">complete</span>
          </div>`).join('');
            }

            /* Locked units */
            const lockedList = $('lockedUnitsList');
            lockedList.innerHTML = locked.map((u, i) => `
        <div class="locked-unit-row" style="opacity:${Math.max(0.15, 0.45 - i * 0.08)};">
          <span class="locked-unit-num">${u.order || ''}</span>
          <span class="locked-unit-name">${u.name}</span>
          <span class="locked-unit-meta">${(u.wordIds || []).length} words</span>
        </div>`).join('');
        }

        /* ══════════════════════════════════════════
           UNIT DETAIL
           ══════════════════════════════════════════ */

        window.openUnit = function (unitId) {
            const u = UNITS.find(u => u.id === unitId);
            if (!u) return;
            currentUnit = u;
            renderUnitDetail(u);
            showScreen('screenUnit');
        };

        function renderUnitDetail(u) {
            const seen = getSeenMap();
            const wordIds = u.wordIds || [];
            const words = wordIds.map(id => WORDS.find(w => w.id === id)).filter(Boolean);
            const seenCount = words.filter(w => seen[w.word]).length;
            const pct = words.length ? Math.round(seenCount / words.length * 100) : 0;
            const progress = getUnitProgress(u.id);

            const statusClass = progress.passed ? 'complete' : (u.released ? 'active' : 'locked');
            const statusLabel = progress.passed ? 'Complete' : (u.released ? 'In progress' : 'Locked');

            /* Hero */
            $('unitDetailHero').innerHTML = `
        <span class="unit-detail-status ${statusClass}">${statusLabel}</span>
        <div class="unit-detail-title">${u.name}</div>
        <div class="unit-detail-meta">${u.level} · ${words.length} words · passmark ${u.passmark || 80}%</div>
        <div class="unit-prog-track">
          <div class="unit-prog-fill" style="width:${pct}%"></div>
        </div>
        <div style="font-family:var(--font-mono);font-size:var(--text-xs);color:var(--clr-ochre);">${seenCount} of ${words.length} words seen</div>
        <div class="word-chips-wrap">
          ${words.map(w => `
            <span class="word-chip ${seen[w.word] ? 'seen' : ''}">${w.word}</span>
          `).join('')}
        </div>`;

            /* Steps */
            const learnDone = progress.learnDone || false;
            const reviewDone = progress.reviewDone || false;
            const passed = progress.passed || false;

            const learnUrl = `words.html?unit=${u.id}&unitName=${encodeURIComponent(u.name)}`;
            const reviewUrl = `quiz-test.html?mode=shuffle&unit=${u.id}&unitName=${encodeURIComponent(u.name)}&review=1`;
            const finalUrl = `quiz-test.html?mode=shuffle&unit=${u.id}&unitName=${encodeURIComponent(u.name)}&final=1`;

            const storeUnit = () => {
                try {
                    sessionStorage.setItem('akaltye_active_unit', JSON.stringify({
                        id: u.id,
                        name: u.name,
                        wordIds: wordIds,
                    }));
                } catch (e) { }
            };

            $('unitSteps').innerHTML = `
<div class="step-row" style="cursor:pointer;" onclick="goToStep('${u.id}', 'learn')">
  <div class="step-num ${learnDone ? 'done' : 'now'}">${learnDone ? '✓' : '1'}</div>
  <div class="step-name ${learnDone ? 'done' : ''}">Learn words</div>
  <div class="step-state ${learnDone ? 'done' : 'now'}">${learnDone ? (passed ? 'retake →' : 'done') : 'start here'}</div>
</div>
<div class="step-row" style="cursor:${learnDone ? 'pointer' : 'not-allowed'};opacity:${learnDone ? 1 : 0.5}" ${learnDone ? `onclick="goToStep('${u.id}', 'review')"` : ''}>
  <div class="step-num ${reviewDone ? 'done' : learnDone ? 'now' : 'todo'}">${reviewDone ? '✓' : '2'}</div>
  <div class="step-name ${reviewDone ? 'done' : ''}">Review test</div>
  <div class="step-state ${reviewDone ? 'done' : learnDone ? 'now' : ''}">${reviewDone ? (passed ? 'retake →' : 'done') : learnDone ? 'ready' : 'locked'}</div>
</div>
<div class="step-row" style="cursor:${reviewDone ? 'pointer' : 'not-allowed'};opacity:${reviewDone ? 1 : 0.5}" ${reviewDone ? `onclick="goToStep('${u.id}', 'final')"` : ''}>
  <div class="step-num ${passed ? 'done' : reviewDone ? 'now' : 'todo'}">${passed ? '✓' : '3'}</div>
  <div class="step-name ${passed ? 'done' : ''}">Final test</div>
  <div class="step-state ${passed ? 'done' : reviewDone ? 'now' : ''}">${passed ? 'retake →' : reviewDone ? 'ready' : 'locked'}</div>
</div>`;

            /* CTA */
            let ctaText, ctaSub, ctaUrl;
            // FIX: If reviewDone is true, skip the learn step (they clearly got through somehow)
            if (!learnDone && !reviewDone) {
                ctaText = 'Start learning words';
                ctaSub = `${words.length} words · tap through each one`;
                ctaUrl = `words.html?unit=${u.id}&unitName=${encodeURIComponent(u.name)}`;
            } else if (!reviewDone) {
                ctaText = 'Take the review test';
                ctaSub = `${words.length} questions · see what you got wrong`;
                ctaUrl = `quiz-test.html?mode=shuffle&unit=${u.id}&review=1`;
            } else if (!passed) {
                ctaText = 'Take the final test';
                ctaSub = `${u.passmark || 80}% to pass and unlock the next unit`;
                ctaUrl = `quiz-test.html?mode=shuffle&unit=${u.id}&final=1`;
            } else {
                ctaText = 'Review this unit';
                ctaSub = 'Already passed — practise for fun';
                ctaUrl = `quiz-test.html?mode=shuffle&unit=${u.id}`;
            }

            $('unitCtaText').textContent = ctaText;
            $('unitCtaSub').textContent = ctaSub;



            $('unitMainCta').onclick = () => { storeUnit(); window.location.href = ctaUrl; };

            /* Practice games — only shown when user has started the unit */
            const practiceWrap = $('unitPracticeWrap');
            if (learnDone && words.length >= 4) {
                practiceWrap.style.display = 'block';
                const url = mode => `quiz-test.html?mode=${mode}&unit=${u.id}&unitName=${encodeURIComponent(u.name)}`;
                const go = mode => { storeUnit(); window.location.href = url(mode); };
                $('modeGuess').onclick = () => go('guess');
                $('modeMeaning').onclick = () => go('meaning');
                $('modeGap').onclick = () => go('gap');
                $('modeShuffle').onclick = () => go('shuffle');
            } else {
                practiceWrap.style.display = 'none';
            }

            /* Scorecard review section */
            const scorecardWrap = $('unitScorecardWrap');
            const scorecardsList = $('scorecardsList');

            if (progress.reviewDone || progress.passed) {
                let scHTML = '';

                if (progress.reviewDone && progress.reviewQuestions) {
                    const reviewPct = Math.round((progress.reviewScore / progress.reviewTotal) * 100);
                    scHTML += `
                        <div class="mode-item" onclick="viewScorecard('${u.id}', 'review')">
                            <div class="mode-item-icon"><i class="fa-solid fa-chart-simple"></i></div>
                            <div style="flex:1;">
                                <div class="mode-item-name">Review test scorecard</div>
                                <div class="mode-item-desc">Score: ${progress.reviewScore}/${progress.reviewTotal} (${reviewPct}%)</div>
                            </div>
                            <span class="mode-item-arr">→</span>
                        </div>
                    `;
                }

                if (progress.passed && progress.finalQuestions) {
                    const finalPct = Math.round((progress.finalScore / progress.finalTotal) * 100);
                    scHTML += `
                        <div class="mode-item" onclick="viewScorecard('${u.id}', 'final')" style="${progress.reviewDone ? 'margin-top:0;' : ''}">
                            <div class="mode-item-icon"><i class="fa-solid fa-trophy"></i></div>
                            <div style="flex:1;">
                                <div class="mode-item-name">Final test scorecard</div>
                                <div class="mode-item-desc">Score: ${progress.finalScore}/${progress.finalTotal} (${finalPct}%) — Passed!</div>
                            </div>
                            <span class="mode-item-arr">→</span>
                        </div>
                    `;
                }

                if (scHTML) {
                    scorecardsList.innerHTML = scHTML;
                    scorecardWrap.style.display = 'block';
                } else {
                    scorecardWrap.style.display = 'none';
                }
            } else {
                scorecardWrap.style.display = 'none';
            }
        }

        $('backToUnits').addEventListener('click', () => {
            currentUnit = null;
            showScreen('screenUnits');
        });

        /* ══════════════════════════════════════════
           SCORECARD REVIEW
           ══════════════════════════════════════════ */
        window.viewScorecard = function (unitId, testType) {
            const progress = getUnitProgress(unitId);
            const u = UNITS.find(unit => unit.id === unitId);
            if (!u) return;

            let questions, score, total;

            if (testType === 'review') {
                if (!progress.reviewQuestions) {
                    showToast('No review results saved');
                    return;
                }
                questions = progress.reviewQuestions;
                score = progress.reviewScore;
                total = progress.reviewTotal;
            } else if (testType === 'final') {
                if (!progress.finalQuestions) {
                    showToast('No final test results saved');
                    return;
                }
                questions = progress.finalQuestions;
                score = progress.finalScore;
                total = progress.finalTotal;
            }

            const results = {
                questions: questions,
                score: score,
                total: total,
                testType: testType,
                unitId: unitId,
                unitName: u.name,
                passmark: u.passmark || 80,
                timestamp: Date.now()
            };

            sessionStorage.setItem('akaltye_quiz_results', JSON.stringify(results));
            window.location.href = 'scorecard.html';
        };

        /* ══════════════════════════════════════════
       GO TO STEP - Navigate to unit steps
       ══════════════════════════════════════════ */
        window.goToStep = function (unitId, step) {
            const u = UNITS.find(unit => unit.id === unitId);
            if (!u) return;

            const wordIds = u.wordIds || [];

            // Store unit data
            try {
                sessionStorage.setItem('akaltye_active_unit', JSON.stringify({
                    id: u.id,
                    name: u.name,
                    wordIds: wordIds,
                }));
            } catch (e) {
                console.error('Failed to store unit data:', e);
            }

            // Navigate to the appropriate page
            const urls = {
                learn: `words.html?unit=${u.id}&unitName=${encodeURIComponent(u.name)}`,
                review: `quiz-test.html?mode=shuffle&unit=${u.id}&unitName=${encodeURIComponent(u.name)}&review=1`,
                final: `quiz-test.html?mode=shuffle&unit=${u.id}&unitName=${encodeURIComponent(u.name)}&final=1`
            };

            if (urls[step]) {
                window.location.href = urls[step];
            }
        };

        /* ══════════════════════════════════════════
           TOAST
           ══════════════════════════════════════════ */
        function showToast(msg) {
            const t = $('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2000);
        }

        /* ══════════════════════════════════════════
           INIT
           ══════════════════════════════════════════ */
        (async () => {
            WORDS = await getWords();

            /* Load units from Firestore */
            try {
                const snap = await getDocs(query(collection(db, 'units'), orderBy('order')));
                UNITS = snap.docs.map(d => ({ id: d.id, ...d.data() }))
                    .filter(u => u.released);
            } catch (e) {
                console.warn('learn: could not load units', e);
                UNITS = [];
            }

            renderUnitsList();
        })();
    </script>

    <script src="https://kit.fontawesome.com/7c89d7deb7.js" crossorigin="anonymous"></script>
    <script type="module" src="/js/nav.js"></script>
</body>

</html>
