<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-17ZB632V40"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-17ZB632V40');
    </script>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Roboto+Mono:wght@300&family=Vollkorn:ital,wght@0,400..900;1,400..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <title>AKALTYE — Sign in</title>

    <style>
        .login-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 64px);
            gap: var(--space-8);
            padding: var(--space-8) var(--space-4);
            max-width: 400px;
            margin: 0 auto;
            text-align: center;
            animation: fadeUp 0.4s ease both;
        }

        .login-logo {
            font-family: var(--font-display);
            font-size: var(--text-2xl);
            font-weight: 600;
            color: var(--clr-light);
            letter-spacing: -1px;
        }

        .login-logo span {
            color: var(--clr-primary-a0);
        }

        .login-heading {
            font-family: var(--font-display);
            font-size: var(--text-xl);
            font-weight: 400;
            color: var(--clr-light);
            line-height: 1.3;
        }

        .login-sub {
            font-family: var(--font-body);
            font-size: var(--text-base);
            color: var(--clr-surface-a50);
            line-height: 1.7;
            max-width: 300px;
        }

        /* Google sign-in button */
        .login-google-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-3);
            width: 100%;
            padding: 14px var(--space-6);
            background: var(--clr-light);
            color: #3c3c3c;
            font-family: var(--font-body);
            font-size: var(--text-md);
            font-weight: 500;
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: background var(--transition-fast), transform 0.1s ease;
        }

        .login-google-btn:hover {
            background: var(--clr-primary-a80);
        }

        .login-google-btn:active {
            transform: scale(0.98);
        }

        .login-google-btn svg {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }

        .login-google-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .login-error {
            font-family: var(--font-mono);
            font-size: var(--text-xs);
            color: var(--clr-danger-a10);
            display: none;
        }

        .login-error.show {
            display: block;
        }

        .login-skip {
            font-family: var(--font-mono);
            font-size: var(--text-xs);
            color: var(--clr-surface-a30);
            letter-spacing: 0.05em;
            cursor: pointer;
            background: none;
            border: none;
            padding: var(--space-2);
            transition: color var(--transition-fast);
            text-decoration: none;
        }

        .login-skip:hover {
            color: var(--clr-surface-a50);
        }

        .login-note {
            font-family: var(--font-mono);
            font-size: var(--text-xs);
            color: var(--clr-surface-a30);
            line-height: 1.8;
            max-width: 280px;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <header>
    </header>

    <div class="page-content">
        <div class="login-wrap">

            <div>
                <h1 class="login-heading">Save your progress</h1>
                <p class="login-sub">
                    Sign in to keep your words, favourites and quiz history
                    across all your devices.
                </p>
            </div>

            <div style="width:100%; display:flex; flex-direction:column; gap: var(--space-3);">

                <!-- Google sign-in -->
                <button class="login-google-btn" id="googleSignInBtn">
                    <!-- Google G logo SVG -->
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                            fill="#4285F4" />
                        <path
                            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                            fill="#34A853" />
                        <path
                            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"
                            fill="#FBBC05" />
                        <path
                            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                            fill="#EA4335" />
                    </svg>
                    Continue with Google
                </button>

                <span class="login-error" id="loginError">Sign-in failed — please try again.</span>

                <!-- Continue without account -->
                <a href="../index.html" class="login-skip">Continue without signing in</a>

            </div>

            <p class="login-note">
                Your progress is saved locally on this device until you sign in.
                Signing in syncs it across devices.
            </p>

        </div>
    </div>

    <script type="module">
        import { signIn } from '../js/auth.js';

        const btn = document.getElementById('googleSignInBtn');
        const err = document.getElementById('loginError');

        btn.addEventListener('click', async () => {
            btn.disabled = true;
            btn.textContent = 'Signing in…';
            err.classList.remove('show');
            try {
                await signIn();
            } catch (e) {
                btn.disabled = false;
                btn.innerHTML = `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="width:20px;height:20px;flex-shrink:0"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg> Continue with Google`;
                err.classList.add('show');
            }
        });
    </script>
    <script type="module" src="/js/nav.js"></script>
</body>

</html>
