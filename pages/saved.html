<!DOCTYPE html>
<!--
  saved.html — Favourites & Bookmarks page for ALKATYE

  WHAT: Shows two sections — favourited words and bookmarked words —
        each rendered as a log list matching the Word Log style in
        history.html.
  HOW:  No inline styles. Behaviour lives in saved.js which reads
        lexicon_favourite_log and lexicon_bookmark_log from localStorage.
  WHY:  Keeping structure, style and behaviour separate means each
        file can be edited independently.
-->
<html lang="en">

<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-17ZB632V40"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-17ZB632V40');
    </script>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Roboto+Mono:wght@300&family=Vollkorn:ital,wght@0,400..900;1,400..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <title>AKALTYE — Saved</title>
</head>

<body>

    <header>
        <div class="nav-bar">
            <a href="../index.html" class="logo">AKA<span>LTYE</span></a>

            <input id="menu-toggler" type="checkbox" class="menu-toggler">
            <label for="menu-toggler" class="show-menu"><span></span></label>

            <nav class="nav">
                <ul class="nav__menu">
                    <li class="nav__item"><a href="explore.html" class="nav__link">Explore</a></li>
                    <li class="nav__item"><a href="practice.html" class="nav__link">Practice</a></li>
                    <li class="nav__item"><a href="profile.html" class="nav__link">Profile</a></li>
                    <li class="nav__item"><a href="resources.html" class="nav__link">Resources</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="page-content">
        <div class="history-wrap">

            <!-- ── Favourites ── -->
            <div>
                <div class="history-section-header">
                    <div class="history-section-title">Favourites</div>
                    <button class="history-clear-btn" id="clearFavBtn">clear</button>
                </div>
                <div id="favLogContainer"></div>
            </div>

            <!-- ── Bookmarks ── -->
            <div>
                <div class="history-section-header">
                    <div class="history-section-title">Bookmarks</div>
                    <button class="history-clear-btn" id="clearBookmarkBtn">clear</button>
                </div>
                <div id="bookmarkLogContainer"></div>
            </div>

        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="../js/saved.js"></script>

</body>

</html>
