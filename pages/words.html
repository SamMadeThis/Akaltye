<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-17ZB632V40"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-17ZB632V40');
    </script>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Google Fonts — shared across the app -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Roboto+Mono:wght@300&family=Vollkorn:ital,wght@0,400..900;1,400..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <!--Font Awesome — same kit used in explore.html-->
    <script src="https://kit.fontawesome.com/7c89d7deb7.js" crossorigin="anonymous"></script>
    <title>AKALTYE</title>

    <style>
        /* Icon-only variant for fav + bookmark buttons */
        .btn-icon {
            flex: 0 0 auto;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            font-size: 1.1rem;
            line-height: 1;
        }
    </style>
</head>

<body>

    <!--Navigation BAR-->
    <header>
        <div class="nav-bar">
            <a href="../index.html" class="logo">AKA<span>LTYE</span></a>

            <input id="menu-toggler" type="checkbox" class="menu-toggler">
            <label for="menu-toggler" class="show-menu">
                <span></span>
            </label>

            <nav class="nav">
                <ul class="nav__menu">
                    <li class="nav__item"><a href="explore.html" class="nav__link">Explore</a></li>
                    <li class="nav__item"><a href="practice.html" class="nav__link">Practice</a></li>
                    <li class="nav__item"><a href="profile.html" class="nav__link">Profile</a></li>
                    <li class="nav__item"><a href="resources.html" class="nav__link">Resources</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="page-content">
        <div class="app">

            <h2>Lexicon</h2>
            <span id="headerMeta"></span>

            <div class="progress-row">
                <div class="progress-track">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="progress-label" id="progressLabel">— / —</div>
            </div>

            <div class="card" id="wordCard">
                <div class="card-top">
                    <span class="pos-badge" id="posbadge">—</span>
                    <span class="seen-badge" id="seenBadge" style="display:none"></span>
                </div>
                <div>
                    <div class="word" id="wordText">—</div>
                    <div class="phonetic" id="phonetic"></div>
                </div>
                <div class="definition" id="definition">—</div>
                <div class="example1" id="example1"></div>
                <div class="example2" id="example2"></div>
                <div class="tags" id="tagsContainer"></div>
            </div>

            <!--
                Single controls row — prev / fav / bookmark / next.
                Fav and bookmark are icon-only squares that sit centred
                between the two flex:1 nav buttons.

                FA icons match explore.html:
                  Favourite  — fa-regular fa-heart (outline) at rest
                               fa-solid fa-heart (filled) when .active
                  Bookmark   — fa-solid fa-bookmark always;
                               active state via CSS border/bg only

                words.js swaps the <i> class on toggle instead of
                setting textContent.
            -->
            <div class="controls">
                <button class="btn" id="prevBtn">← prev</button>

                <!-- Favourite — outline heart at rest, solid when active -->
                <button class="btn btn-fav btn-icon" id="favBtn" title="Favourite">
                    <i class="fa-regular fa-heart"></i>
                </button>

                <!-- Bookmark — solid bookmark; active state via CSS only -->
                <button class="btn btn-bookmark btn-icon" id="bookmarkBtn" title="Bookmark">
                    <i class="fa-solid fa-bookmark"></i>
                </button>

                <button class="btn" id="nextBtn">next →</button>
            </div>

            <!--
                OLD controls rows — collapsed into the single row above:
                <div class="controls">
                    <button class="btn btn-seen" id="seenBtn">mark as seen</button>
                    <button class="btn btn-fav" id="favBtn">♡ favourite</button>
                </div>
                <div class="controls">
                    <button class="btn btn-bookmark" id="bookmarkBtn">🔖 bookmark</button>
                </div>
            -->

        </div>

        <div class="toast" id="toast"></div>
    </div>

    <script type="module" src="../js/words.js"></script>

</body>

</html>
