<!DOCTYPE html>
<html lang="en">

<head>

        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-17ZB632V40');
    </script>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Roboto+Mono:wght@300&family=Vollkorn:ital,wght@0,400..900;1,400..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <script src="https://kit.fontawesome.com/7c89d7deb7.js" crossorigin="anonymous"></script>
    <title>AKALTYE</title>

    <style>
        .btn-icon {
            flex: 0 0 auto;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            font-size: 1.1rem;
            line-height: 1;
        }

        /* ── Slide-and-replace viewport ──────────────────────
           Clips both card slots so only the one at left:0
           is visible. The two .card elements slide inside it.
           min-height matches the card's own min-height so
           the container never collapses during the slide.
        ──────────────────────────────────────────────────── */
        .card-viewport {
            position: relative;
            overflow: hidden;
            border-radius: var(--radius-lg);
            /* match .card min-height so viewport never collapses */
            min-height: 280px;
            margin-bottom: var(--space-4);
        }

        /* Cards are now absolutely positioned inside the viewport */
        .card {
            position: absolute;
            top: 0;
            width: 100%;
            /* left is controlled by JS — active card sits at 0%,
               inactive card is parked off-screen at ±100% */
            margin-bottom: 0;
            /* viewport provides the spacing now */
        }

        /* Remove the old fade-out class — slide handles transitions */
        .card.fade-out {
            opacity: 1;
            transform: none;
        }
    </style>
</head>

<body>

    <header>
        <div class="nav-bar">
            <a href="../index.html" class="logo">AKA<span>LTYE</span></a>

            <input id="menu-toggler" type="checkbox" class="menu-toggler">
            <label for="menu-toggler" class="show-menu">
                <span></span>
            </label>

            <nav class="nav">
                <ul class="nav__menu">
                    <li class="nav__item"><a href="explore.html" class="nav__link">Explore</a></li>
                    <li class="nav__item"><a href="practice.html" class="nav__link">Practice</a></li>
                    <li class="nav__item"><a href="profile.html" class="nav__link">Profile</a></li>
                    <li class="nav__item"><a href="resources.html" class="nav__link">Resources</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="page-content">
        <div class="app">

            <h2>Lexicon</h2>
            <span id="headerMeta"></span>

            <div class="progress-row">
                <div class="progress-track">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="progress-label" id="progressLabel">— / —</div>
            </div>

            <!-- Slide viewport — two card slots live inside -->
            <div class="card-viewport">
                <!-- Slot A — starts as the active card (left: 0) -->
                <div class="card" id="wordCardA" style="left: 0%">
                    <div class="card-top">
                        <span class="pos-badge" id="posbadge">—</span>
                        <span class="seen-badge" id="seenBadge" style="display:none"></span>
                    </div>
                    <div>
                        <div class="word" id="wordText">—</div>
                        <div class="phonetic" id="phonetic"></div>
                    </div>
                    <div class="definition" id="definition">—</div>
                    <div class="examples" id="examples"></div>
                    <div class="notes" id="notes" style="display:none"></div>
                    <div class="tags" id="tagsContainer"></div>
                </div>

                <!-- Slot B — parked off-screen to the right initially -->
                <div class="card" id="wordCardB" style="left: 100%">
                    <!-- content injected by JS before each slide -->
                </div>
            </div>

            <div class="controls">
                <button class="btn" id="prevBtn">← prev</button>

                <button class="btn btn-fav btn-icon" id="favBtn" title="Favourite">
                    <i class="fa-regular fa-heart"></i>
                </button>

                <button class="btn btn-bookmark btn-icon" id="bookmarkBtn" title="Bookmark">
                    <i class="fa-solid fa-bookmark"></i>
                </button>

                <button class="btn" id="nextBtn">next →</button>
            </div>

        </div>

        <div class="toast" id="toast"></div>
    </div>

    <script type="module" src="../js/words.js"></script>

</body>

</html>
